project:
  output-dir: _book-pdf

format:
  pdf:
    reference-location: document
    geometry:
      - left=25mm
      - right=25mm
      - top=25mm
      - bottom=25mm
    header-includes:
      - \setlength{\LTpost}{1pt}
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true
    fig-cap-location: bottom
    tbl-cap-location: top
    include-in-header:
      - cover.tex
      - text: |
          \usepackage{caption}
          \captionsetup[figure]{font=footnotesize}
